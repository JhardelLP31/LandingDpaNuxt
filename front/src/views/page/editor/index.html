   <script type="text/javascript">
	   // INICIO REFERENCIAS DE ORIGEN
	   
	   /* En todas las páginas del sitio */
	   
	   // Create cookie
	   function createCookie(name, value, days) {
		   var expires;
		   if (days) {
			   var date = new Date();
			   date.setTime(date.getTime()+(days*24*60*60*1000));
			   expires = "; expires="+date.toGMTString();
		   }
		   else {
			   expires = "";
		   }
		   // document.cookie = name+"="+value+expires+";path=/";
		   document.cookie = name+"="+value+expires+";site=ue.edu.pe;path=/";
	   }
	   
	   // Read cookie
	   function readCookie(name) {
		   var nameEQ = name + "=";
		   var ca = document.cookie.split(';');
		   for(var i=0;i < ca.length;i++) {
			   var c = ca[i];
			   while (c.charAt(0) === ' ') {
				   c = c.substring(1,c.length);
			   }
			   if (c.indexOf(nameEQ) === 0) {
				   return c.substring(nameEQ.length,c.length);
			   }
		   }
		   return null;
	   }
	   
	   // Erase cookie
	   function eraseCookie(name) {
		   createCookie(name,"",-1);
	   }
	   
	   const uri_params = new Proxy(new URLSearchParams(window.location.search), {
		 get: (searchParams, prop) => searchParams.get(prop),
	   });
	   
	   /* Aquí comienza la captura de referrer y procedencia */
	   
	   
	   try {
		 var referrer = String(document.referrer);
		 
		 var source_campaign = "(direct)";
		 if (uri_params.utm_source != null) {
			 source_campaign = uri_params.utm_source + " | " + String(uri_params.utm_medium) + " | " + String(uri_params.utm_campaign) + " | " + String(uri_params.utm_id) + " | " + String(uri_params.utm_term) + " | " + String(uri_params.utm_content);
		 } else if (uri_params.src != null) {
			 source_campaign = uri_params.src;
		 } else if ((referrer.indexOf('ue.edu.pe') == -1) && (referrer != '') ){
			 source_campaign = referrer;
		 } else if (referrer.indexOf('ue.edu.pe') > -1) {
			 source_campaign = '';
		 }
		 
		 var fecha_y_hora = new Date();
		
		 
	   } catch (error) {
		 console.error(error);
		 // expected output: ReferenceError: nonExistentFunction is not defined
		 // Note - error messages will vary depending on browser
	   }
	   
	   
	   var procedencia_hasta_ahora = readCookie('procedencia');
	   
	   if (source_campaign != '') {
		   var nueva_procedencia = source_campaign + ' || ' + fecha_y_hora.toJSON();
	   
		   if (procedencia_hasta_ahora == null) {
			   
			   procedencia_hasta_ahora = nueva_procedencia;
			   createCookie('procedencia', procedencia_hasta_ahora)
			   
		   } else {
			   
			   const procedencias = procedencia_hasta_ahora.split(' ||| ');
			   const cuantas_procedencias = procedencias.length;
			   const ultima_procedencia = procedencias[cuantas_procedencias-1].split(' || ');
			   
			   console.log(ultima_procedencia);
			   
			   const dias_que_pasaron = (fecha_y_hora - new Date(ultima_procedencia[1])) / (1000*60*60*24);
			   
			   console.info(dias_que_pasaron);
			   
			   const pasaron_mas_de_seis = dias_que_pasaron > 6; // han pasado más de seis días
			   
			   console.log(pasaron_mas_de_seis);
			   
			   if ((ultima_procedencia[0] != source_campaign) || (pasaron_mas_de_seis)) {
				   procedencia_hasta_ahora = procedencia_hasta_ahora + ' ||| ' + nueva_procedencia;
				   createCookie('procedencia', procedencia_hasta_ahora)
			   }
		   }		
	   }
	   
	   
	   /* sólo en la página de cada formulario */
	   
	   const el_form = document.forms['f1'];
	   
	   const el_elem_referrer = el_form.elements['refererhidden']; // campo nuevo oculto o hidden
	   const el_elem_procedenciea = el_form.elements['procedenciahidden']; // campo nuevo oculto o hidden
	   
	   el_elem_referrer.value = referrer;
	   el_elem_procedenciea.value = procedencia_hasta_ahora;
	   
	   
	   </script>

// Example starter JavaScript for disabling form submissions if there are invalid fields

 // Fetch all the forms we want to apply custom Bootstrap validation styles to
 var forms = document.querySelectorAll('.needs-validation')

 // Loop over them and prevent submission
 Array.prototype.slice.call(forms)
